<div class="card">
  <div class="card-header">
    <div>
      <h3 style="margin-bottom: 0.25rem;">{{ server().name }}</h3>
      <code style="color: var(--text-muted); font-size: 0.7rem;">ID: #{{ server().id }}</code>
    </div>
    
    <span [appStatusBadge]="server().status">
      {{ statusLabel() }}
    </span>
  </div>

  <div class="meter-container">
    <div class="meter-label">
      <span>CPU LOAD</span>
      <span>{{ server().cpuUsage }}%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="server().cpuUsage"></div>
    </div>
  </div>

  <button app-btn variant="primary" (click)="onDetailsClick()">
    Inspect Instance
  </button>
</div>
