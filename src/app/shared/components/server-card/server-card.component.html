<div class="group relative p-5 rounded-2xl border border-zinc-800 bg-zinc-900/50 hover:bg-zinc-900/80 hover:border-violet-500/50 transition-all duration-300 shadow-xl">
  <div class="flex justify-between items-start mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700 group-hover:border-violet-500/30 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-400 group-hover:text-violet-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-zinc-100">{{ server().name }}</h3>
        <p class="text-[10px] text-zinc-500 font-mono">ID: #{{ server().id }}</p>
      </div>
    </div>
    
    <span class="px-2 py-1 text-[10px] font-bold uppercase tracking-tighter rounded-md border"
          [ngClass]="{
            'bg-green-500/10 text-green-500 border-green-500/20': server().status === 'online',
            'bg-red-500/10 text-red-500 border-red-500/20': server().status === 'offline'
          }">
      {{ statusLabel() }}
    </span>
  </div>

  <div class="space-y-3 mb-6">
    <div>
      <div class="flex justify-between text-[11px] mb-1 px-1">
        <span class="text-zinc-500 uppercase">CPU LOAD</span>
        <span class="text-zinc-300 font-mono">{{ server().cpuUsage }}%</span>
      </div>
      <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
        <div class="h-full bg-violet-500 transition-all duration-500" [style.width.%]="server().cpuUsage"></div>
      </div>
    </div>
  </div>

  <button 
    [class]="buttonClass()"
    (click)="onDetailsClick()">
    Inspect Instance
  </button>
</div>
