<app-form-card>
  <h2 form-title>{{ previewLabel() }}</h2>

  <form [formGroup]="form" form-body class="standard-form">
    <div class="form-field">
      <label for="name">Nome Nodo</label>
      <input id="name" type="text" formControlName="name" 
             [class.invalid]="form.get('name')?.invalid && form.get('name')?.touched">
      
      @if (form.get('name')?.hasError('minlength')) {
        <small class="error-text">Troppo corto! Serve almeno 3 caratteri.</small>
      }
    </div>

    <div class="form-field">
      <label for="ip">Indirizzo IP</label>
      <input id="ip" type="text" formControlName="ip" placeholder="192.168.x.x">
    </div>
  </form>

  <div form-actions>
    <button class="btn" data-variant="ghost" (click)="form.reset()">Reset</button>
    
    <button class="btn" 
            data-variant="primary" 
            [disabled]="form.invalid || isPending()" 
            (click)="onSubmit()">
      @if (isPending()) {
        <span class="spinner"></span> Caricamento...
      } @else {
        Salva Server
      }
    </button>
  </div>
</app-form-card>
