<div class="max-w-7xl mx-auto space-y-8">
  <div class="flex items-end justify-between">
    <div>
      <h2 class="text-3xl font-bold tracking-tight text-white">System Monitor</h2>
      <p class="text-zinc-400 mt-1 font-mono text-sm uppercase tracking-wider">Active instances cluster_01</p>
    </div>
    
    <div class="w-72 h-10 bg-zinc-900 border border-zinc-800 rounded-lg flex items-center px-3 text-zinc-600 italic text-sm">
      Cerca server... (In arrivo)
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="p-4 rounded-xl border border-zinc-800 bg-zinc-900/30 backdrop-blur-sm">
      <p class="text-zinc-500 text-xs uppercase font-semibold">Total Nodes</p>
      <p class="text-2xl font-mono">{{ servers().length }}</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    @for (server of servers(); track server.id) {
      <app-server-card 
        [server]="server" 
        (select)="handleServerSelection($event)" />
    } @empty {
      <div class="col-span-full py-20 flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 rounded-2xl bg-zinc-900/10">
        <p class="text-zinc-500 font-medium">Nessun server trovato nel database.</p>
      </div>
    }
  </div>
</div>
