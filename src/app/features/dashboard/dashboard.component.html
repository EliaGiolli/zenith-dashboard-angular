<div class="dashboard-header">
  <h1 class="dashboard-title">System Monitor</h1>
  <p style="color: var(--text-muted)">Active instances cluster_01</p>
</div>

<div class="stats-bar">
  <div class="stat-card">
    <span style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;">Total Inspections</span>
    <div class="stat-value">{{ inspectionCount() }}</div>
  </div>
</div>

<div class="dashboard-controls">
  <app-search-input [(value)]="searchQuery" />
</div>

<div class="server-grid">
  @for (server of servers(); track server.id) {
    <app-server-card 
      [server]="server" 
      (select)="handleServerSelection($event)">
    </app-server-card>
  } @empty {
    <div class="empty-state">
      <p>Nessun server trovato nel database.</p>
    </div>
  }
</div>
